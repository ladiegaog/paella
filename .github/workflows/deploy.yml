name: deploy

# Despliega el Worker a Cloudflare en cada push a main.
# Requiere el secret de repositorio CLOUDFLARE_API_TOKEN (ver README).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Permisos mínimos: sólo leer el contenido del repo.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # wrangler 4.x exige Node >= 22.
          node-version: 22
          cache: npm

      - run: npm ci

      # Si los tests fallan, no se despliega.
      - run: npm test

      - name: Desplegar a Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          # OJO: sin esto, wrangler-action usa su wrangler embebido (3.x), que
          # NO entiende `assets.run_worker_first` y lo descarta con un warning
          # → producción serviría los assets SIN pasar por el worker (/subir
          # sin login y 405 en los POST). Mantener en línea con package.json.
          wranglerVersion: "4.136.3"
