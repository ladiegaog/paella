<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
  <title>entrar — paellas.party</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#faf6f0" />
</head>
<body class="cuerpo-entrar">
  <main class="caja-entrar">
    <span class="logo" aria-hidden="true">🥘</span>
    <h1>paellas<span class="marca-tld">.party</span></h1>
    <form method="post" action="/api/login" class="form-entrar">
      <label class="visually-hidden" for="usuario">usuario</label>
      <input id="usuario" type="text" name="usuario" placeholder="usuario" autofocus required
             autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" />
      <label class="visually-hidden" for="password">contraseña</label>
      <input id="password" type="password" name="password" placeholder="contraseña" required autocomplete="current-password" />
      <button type="submit">entrar</button>
    </form>
    <p id="err" class="error-entrar" role="alert"></p>
    <a href="/" class="ayuda">volver</a>
  </main>
  <script>
    if (new URLSearchParams(location.search).get('e')) {
      document.getElementById('err').textContent = 'usuario o contraseña incorrectos';
    }
  </script>
</body>
</html>
