<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- iOS ignora los SVG aquí: sin un PNG, al añadirla a la pantalla de inicio
       pone una captura de la web como icono en vez del logo. -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="paellas" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="preload" href="/vendor/fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin />
  <script src="/js/pwa.js" defer></script>
  <title>entrar — paellas.party</title>
  <meta name="robots" content="noindex" />
  <!-- Dos theme-color: la barra del navegador y la de la app instalada siguen
       al tema del sistema en vez de quedarse siempre en claro. -->
  <meta name="theme-color" content="#faf6f0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#12100d" media="(prefers-color-scheme: dark)" />
</head>
<body class="cuerpo-entrar">
  <main class="caja-entrar">
    <span class="logo" aria-hidden="true">🥘</span>
    <h1>paellas<span class="marca-tld">.party</span></h1>
    <form method="post" action="/api/login" class="form-entrar">
      <label class="visually-hidden" for="usuario">usuario</label>
      <input id="usuario" type="text" name="usuario" placeholder="usuario" autofocus required
             autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" />
      <label class="visually-hidden" for="password">contraseña</label>
      <input id="password" type="password" name="password" placeholder="contraseña" required autocomplete="current-password" />
      <button type="submit">entrar</button>
    </form>
    <p id="err" class="error-entrar" role="alert"></p>
    <a href="/" class="ayuda">volver</a>
  </main>
  <script src="/js/page-entrar.js" defer></script>
</body>
</html>
