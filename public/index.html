<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- iOS ignora los SVG aquí: sin un PNG, al añadirla a la pantalla de inicio
       pone una captura de la web como icono en vez del logo. -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="paellas" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="preload" href="/vendor/fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin />
  <script src="/js/pwa.js" defer></script>
  <title>paellas.party</title>
  <meta name="description" content="Las paellas que va haciendo la diega." />
  <!-- Dos theme-color: la barra del navegador y la de la app instalada siguen
       al tema del sistema en vez de quedarse siempre en claro. -->
  <meta name="theme-color" content="#faf6f0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#12100d" media="(prefers-color-scheme: dark)" />
</head>
<body>
  <header class="topbar">
    <a class="marca" href="/"><span class="logo" aria-hidden="true">🥘</span> <span>paellas<span class="marca-tld">.party</span></span></a>
    <nav class="topbar-acciones" aria-label="acciones">
      <a href="/entrar" data-anon-only hidden>entrar</a>
      <form method="post" action="/api/logout" data-authed-only hidden>
        <button type="submit">salir</button>
      </form>
    </nav>
  </header>

  <main class="page">
    <!-- el bloque de subir: lo monta page-home.js sólo con sesión -->
    <section class="composer" id="composer" data-authed-only hidden></section>

    <div class="tagbar" id="tagbar" aria-label="filtrar por hashtag"></div>

    <section class="feed" id="feed"></section>
    <div class="centinela" id="centinela" aria-hidden="true"></div>
  </main>

  <script type="module" src="/js/page-home.js"></script>
</body>
</html>
